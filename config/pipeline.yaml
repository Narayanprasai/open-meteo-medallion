# Pipeline configuration. Choices below were verified with scripts/probe_api.py (see docs/ai_log.md).

# Forecast models to ingest and compare. Both archive d1..d7 for Australia from at least July 2024.
# Excluded: bom_access_global (no data, live or archived), icon_global (no day 7),
#           ecmwf_ifs 9 km (archive only from early 2026).
models:
  - ecmwf_ifs025
  - gfs_global

forecast_days: 7
lead_days: [1, 2, 3, 4, 5, 6, 7]

# Backfill window for Previous Runs and actuals. One full year covers every season and both DST changes.
backfill_start: "2025-10-01"

# Truth source. Must be pinned: the archive's default model fills recent days with forecasts.
# Pure ERA5 lags about 6 days; recent days are re-fetched every run so late values fill in.
actuals:
  model: era5
  lookback_days: 10

# Scored variables: requested at every lead day and compared with ERA5 (all verified complete, probe section 6).
scored_variables:
  - temperature_2m
  - precipitation
  - wind_speed_10m
  - relative_humidity_2m

# Display variables: live forecast only. ECMWF has no weather_code at lead days 1..7.
display_variables:
  - weather_code

# Request pacing. One month for all locations, models and leads is ~3 MB and ~10 s (probe section 7).
backfill_chunk: month
pause_between_requests_seconds: 10

timezone: GMT  # always UTC at ingestion; local time is derived in gold
